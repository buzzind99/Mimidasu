name: Mimidasu
options:
  bundleIdPrefix: mimidasu
  deploymentTarget:
    macOS: "15.5"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.5"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    # CURRENT_PROJECT_VERSION lives in local/signing.xcconfig (commit count,
    # written by scripts/bootstrap.sh): an explicit project-level setting here
    # would take precedence over the xcconfig. Packaging scripts pass their own
    # value on the xcodebuild command line.
    MARKETING_VERSION: "1.0.0-beta.2"
    ARCHS: arm64

# Signing identity comes from local/signing.xcconfig (gitignored), written by
# scripts/bootstrap.sh: "Mimidasu Dev" when that certificate exists, ad-hoc (-)
# otherwise. project.yml deliberately does not set CODE_SIGN_IDENTITY —
# explicit build settings would override the xcconfig.
configFiles:
  Debug: local/signing.xcconfig
  Release: local/signing.xcconfig

targets:
  Mimidasu:
    type: application
    platform: macOS
    sources:
      - path: Mimidasu
    # NSAudioCaptureUsageDescription gates the system-audio-capture prompt
    # the tap's aggregate triggers at first IO; it is not a recognized
    # INFOPLIST_KEY_ build setting, so it must live in the plist itself.
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Mimidasu
        # Version keys resolve through build settings so the MAS packaging step
        # can pass a fresh CURRENT_PROJECT_VERSION without editing this file.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # HTTPS-only + Apple crypto: qualifies for the export-compliance
        # exemption; declaring it skips the per-build App Store Connect question.
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright © 2026 Aulia Sufian Adi. All rights reserved."
        NSAudioCaptureUsageDescription: "Mimidasu captures your Mac's system audio to transcribe it. Audio is always processed locally and never leaves your Mac. When a cloud translation provider is enabled in Settings, only the transcribed text is transmitted to that provider."
    settings:
      base:
        PRODUCT_NAME: Mimidasu
        PRODUCT_BUNDLE_IDENTIFIER: mimidasu.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(SRCROOT)/local/frameworks @executable_path/../Frameworks $(SRCROOT)/local/frameworks/crispasr @executable_path/../Frameworks/crispasr"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
      configs:
        Release:
          # App Sandbox for every distributed artifact (DMG + MAS). Debug
          # stays unsandboxed: the test host bundle reads repo-local
          # dictionary data, which the sandbox container cannot reach.
          CODE_SIGN_ENTITLEMENTS: Config/Mimidasu.entitlements
    scheme:
      gatherCoverageData: true
      testTargets:
        - MimidasuTests
  MimidasuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MimidasuTests
    dependencies:
      - target: Mimidasu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mimidasu.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mimidasu.app/Contents/MacOS/Mimidasu"
        BUNDLE_LOADER: "$(TEST_HOST)"

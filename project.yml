name: Mimi
options:
  bundleIdPrefix: mimi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    ARCHS: arm64

# Signing identity comes from local/signing.xcconfig (gitignored), written by
# scripts/bootstrap.sh: "Mimi Dev" when that certificate exists, ad-hoc (-)
# otherwise. project.yml deliberately does not set CODE_SIGN_IDENTITY —
# explicit build settings would override the xcconfig.
configFiles:
  Debug: local/signing.xcconfig
  Release: local/signing.xcconfig

targets:
  Mimi:
    type: application
    platform: macOS
    sources:
      - path: Mimi
    # NSAudioCaptureUsageDescription gates the system-audio-capture prompt
    # the tap's aggregate triggers at first IO; it is not a recognized
    # INFOPLIST_KEY_ build setting, so it must live in the plist itself.
    info:
      path: Config/Info.plist
      properties:
        NSAudioCaptureUsageDescription: "Mimi captures your Mac's system audio to transcribe it. Audio is always processed locally and never leaves your Mac. When a cloud translation provider is enabled in Settings, only the transcribed text is transmitted to that provider."
    settings:
      base:
        PRODUCT_NAME: Mimi
        PRODUCT_BUNDLE_IDENTIFIER: mimi.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(SRCROOT)/local/frameworks @executable_path/../Frameworks $(SRCROOT)/local/frameworks/crispasr @executable_path/../Frameworks/crispasr"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
      configs:
        Release:
          # App Sandbox for every distributed artifact (DMG + MAS). Debug
          # stays unsandboxed: the test host bundle reads repo-local
          # dictionary data, which the sandbox container cannot reach.
          CODE_SIGN_ENTITLEMENTS: Config/Mimi.entitlements
    scheme:
      gatherCoverageData: true
      testTargets:
        - MimiTests
  MimiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MimiTests
    dependencies:
      - target: Mimi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mimi.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mimi.app/Contents/MacOS/Mimi"
        BUNDLE_LOADER: "$(TEST_HOST)"
